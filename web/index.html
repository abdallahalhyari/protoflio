  <script>
    // Rewrite canonical + og:url from location.origin so browsers see the
    // real URL. Crawlers ignore JS and use the hardcoded values above.
    (function () {
      var origin = location.origin + location.pathname;
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.setAttribute('href', origin);
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', origin);
    })();

    // Hide loader once Flutter is running.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('boot-loader');
      if (l) { l.classList.add('hidden'); setTimeout(function(){ l.remove(); }, 500); }
    });
  </script>
