name: profile
description: "Abdallah Alhyari portfolio — Flutter web/mobile app deployed to alhyari.web.app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1
  firebase_core:
  shared_preferences: ^2.5.5
  firebase_analytics: ^12.5.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/projects/

  fonts:
    - family: Tenada
      fonts:
        - asset: fonts/Tenada.ttf
