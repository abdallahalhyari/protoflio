name: profile
description: "Abdallah Alhyari portfolio — Flutter web/mobile app deployed to alhyari.web.app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/projects/
    - assets/images/hats/

  fonts:
    - family: Tenada
      fonts:
        - asset: fonts/Tenada.ttf
